# NEXORA en Cloudflare, plan gratuito ($0, sin tarjeta).
# Pantallas: incluidas en el paquete del Worker. API: Durable Object con SQLite (la base completa).
name = "nexora-staging"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "NEXORA"
class_name = "Nexora"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Nexora"]

[observability]
enabled = true
