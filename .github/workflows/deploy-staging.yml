# Sube a staging en Cloudflare (plan gratuito) cada push a la rama `staging`, solo si las pruebas pasan.
# Secretos de GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID                    (obligatorios)
#   ADMIN_USERNAME, ADMIN_PASSWORD, ADMIN_PHONE, ADMIN_EMAIL        (usuario del super panel; se crea al primer arranque)
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM             (SMS; opcionales)
#   RESEND_API_KEY, MAIL_FROM                                      (correo; opcionales)
name: Deploy staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
concurrency: deploy-staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build:worker
      - name: Secretos del servidor (solo los que existan)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          S_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          S_ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          S_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          S_TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          S_TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          S_TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          S_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          S_MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          node -e '
            const out = {}
            for (const [k, v] of Object.entries(process.env)) if (k.startsWith("S_") && v) out[k.slice(2)] = v
            require("fs").writeFileSync("secrets.json", JSON.stringify(out))
          '
          npx wrangler deploy | tee deploy.log
          npx wrangler secret bulk secrets.json
          rm secrets.json
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Staging: $URL"
          sleep 10 && curl -fsS "$URL/api/health"
