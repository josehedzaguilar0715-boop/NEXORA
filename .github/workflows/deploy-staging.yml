# Sube a staging (Fly.io) cada push a la rama `staging`, solo si las pruebas pasan.
# Requiere el secreto FLY_API_TOKEN en GitHub (Settings → Secrets and variables → Actions).
name: Deploy staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
concurrency: deploy-staging
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Primera vez: crea la app y el disco si no existen (idempotente).
      - run: flyctl apps create nexora-staging-mx --org personal || true
      - run: flyctl volumes list -a nexora-staging-mx | grep -q nexora_data || flyctl volumes create nexora_data -a nexora-staging-mx --region dfw --size 1 --yes
      - run: flyctl deploy --remote-only
      - run: curl -fsS https://nexora-staging-mx.fly.dev/api/health
