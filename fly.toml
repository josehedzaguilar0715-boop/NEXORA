# Staging de NEXORA en Fly.io. Una máquina siempre encendida (la caja no debe esperar a que despierte)
# y un disco persistente con la base SQLite. Fly toma copia diaria del disco (5 días).
app = "nexora-staging-mx"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXORA_DB = "/data/nexora.db"

[[mounts]]
  source = "nexora_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
